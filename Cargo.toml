[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/freebsd-oss",
]

[workspace.package]
version = "0.9.12"
edition = "2024"
rust-version = "1.98"
authors = [
    "Alex S <shkhln@users.noreply.github.com>",
    "Kevin Bowling <kevin.bowling@kev009.com>",
]
license = "MIT"
repository = "https://github.com/kev009/pw-oss"

[workspace.dependencies]
cc = "1.11.3"
libc = "0.2.191"
libspa = "0.10.1"
nix = "0.32.0"
regex = "1.13.2"
uds = "=0.4.2"

[profile.release]
lto = "fat"
codegen-units = 1
